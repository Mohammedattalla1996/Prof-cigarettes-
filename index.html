<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Prof Cigarettes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#a8662b"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png">
<title>Prof Cigarettes</title>
<style>
:root{--bg:#f6f1ea;--card:#fff;--tx:#2b2118;--mu:#8a7a69;--pr:#a8662b;--prt:#fff;--ok:#2e7d4f;--bad:#c0392b;--bd:#e6dccf;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1612;--card:#2a221b;--tx:#f3ebe1;--mu:#a89883;--pr:#d08b4a;--prt:#1b1612;--bd:#3d3228}}
:root[data-theme="dark"]{--bg:#1b1612;--card:#2a221b;--tx:#f3ebe1;--mu:#a89883;--pr:#d08b4a;--prt:#1b1612;--bd:#3d3228}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Segoe UI",Tahoma,sans-serif;padding-bottom:70px}
header{padding:12px 14px;font-weight:700;font-size:18px;display:flex;justify-content:space-between;align-items:center}
header small{color:var(--mu);font-weight:400;font-size:12px}
main{padding:0 12px 20px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;border:0;background:none;color:var(--mu);padding:10px 2px;font-size:11px;font-family:inherit}
nav button b{display:block;font-size:20px}nav button.on{color:var(--pr);font-weight:700}
input,select,textarea,button{font-family:inherit;font-size:16px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);margin:4px 0}
.btn{background:var(--pr);color:var(--prt);border:0;border-radius:10px;padding:11px 14px;font-weight:700}
.btn.g{background:none;color:var(--pr);border:1px solid var(--pr)}.btn.r{background:var(--bad);color:#fff}.btn.s{padding:6px 10px;font-size:13px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;margin:8px 0}
.row{display:flex;gap:8px;align-items:center}.sp{justify-content:space-between}.mu{color:var(--mu);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.it{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px;text-align:center;position:relative}
.it img,.ph{width:100%;height:80px;object-fit:cover;border-radius:8px;background:var(--bd);display:flex;align-items:center;justify-content:center;font-size:28px}
.it .st{position:absolute;top:6px;left:8px;font-size:18px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0}.chips button{white-space:nowrap}
.th{width:44px;height:44px;border-radius:8px;object-fit:cover;background:var(--bd);display:flex;align-items:center;justify-content:center}
.ov{position:fixed;inset:0;background:#0009;z-index:20;display:flex;align-items:flex-end}
.md{background:var(--bg);width:100%;max-height:90%;overflow:auto;border-radius:18px 18px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px))}
.bar{position:sticky;bottom:64px;background:var(--pr);color:var(--prt);border-radius:14px;padding:12px;margin-top:10px;display:flex;justify-content:space-between;align-items:center;font-weight:700}
.bad{color:var(--bad)}.ok{color:var(--ok)}
.pm button{flex:1;padding:10px 4px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font-size:14px}.pm button.on{background:var(--pr);color:var(--prt);border-color:var(--pr)}
.pm{display:flex;flex-wrap:wrap;gap:6px}.pm button{flex:1 1 30%}
h3{margin:12px 0 4px}
.rt{width:100%;border-collapse:collapse;margin:6px 0}.rt td,.rt th{padding:6px;border-bottom:1px solid var(--bd);text-align:right;font-size:14px}.rt th{color:var(--mu);font-size:13px}
#cartfab{position:fixed;left:14px;bottom:calc(78px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:50%;border:0;background:var(--pr);color:var(--prt);font-size:28px;box-shadow:0 4px 14px #0007;z-index:6;display:none}
#cbd{position:absolute;top:-4px;right:-4px;min-width:24px;height:24px;border-radius:12px;background:var(--bad);color:#fff;font-size:14px;font-weight:700;line-height:24px;padding:0 6px;font-family:inherit}
.md .bar{bottom:0}
.it,.card,.chips button,nav button{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
.it img,.it .ph{pointer-events:none;-webkit-touch-callout:none}
.kd{min-height:56px;border:1px solid var(--bd);border-radius:12px;background:var(--card);font-size:32px;text-align:center;line-height:56px;margin:6px 0;direction:ltr;color:var(--tx)}.kd:empty::before{content:attr(data-ph);color:var(--mu);font-size:16px}
.kg{direction:ltr;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}.kg button{padding:16px 0;font-size:26px;border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx)}.kg button:active{background:var(--bd)}
#prn{display:none}
@media print{body>*:not(#prn){display:none!important}#prn{display:block!important;direction:rtl;color:#000;background:#fff;font-size:12px;font-family:-apple-system,'Segoe UI',Tahoma,sans-serif}body{background:#fff!important;padding:0!important}:root{padding:0!important}#prn table{width:100%;border-collapse:collapse;margin:6px 0}#prn th,#prn td{border:1px solid #444;padding:4px;text-align:right;color:#000}#prn th{background:#eee}.pb{page-break-inside:avoid;margin-bottom:14px}}
</style>
</head>
<body>
<header><span>🚬 Prof Cigarettes<br><small id="dt"></small></span><span id="bal" style="text-align:left"></span></header>
<main id="m"></main>
<nav id="nv"></nav>
<div id="prn"></div>
<button id="cartfab" onclick="cartView()">🛒<span id="cbd"></span></button>
<div id="ov2" class="ov" style="display:none;z-index:40" onclick="if(event.target===this)cl2()"><div class="md" id="md2"></div></div>
<div id="ov" class="ov" style="display:none" onclick="if(event.target===this)cl()"><div class="md" id="md"></div></div>
<script>
const $=s=>document.querySelector(s);
const def=()=>({items:[],sups:[],custs:[],sales:[],n:0});
let db;try{db=JSON.parse(localStorage.getItem('pc')||'')||def()}catch(e){db=def()}
db.users=db.users||{admin:'admin123',user:'user123'};db.adj=db.adj||[];db.exps=db.exps||[];db.buys=db.buys||[];db.spays=db.spays||[];db.roll=db.roll||{g:0.4,lz:0,ot:0};db.accts=db.accts||[{u:'admin',p:(db.users&&db.users.admin)||'admin123',r:'admin'},{u:'user',p:(db.users&&db.users.user)||'user123',r:'user'}];
function save(){try{localStorage.setItem('pc',JSON.stringify(db))}catch(e){alert('المساحة ممتلئة، صدّر نسخة احتياطية واحذف صوراً')}}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const f=n=>(Math.round(n*100)/100)+' ₪';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const find=(a,id)=>db[a].find(x=>x.id===id);
const day=d=>new Date(d).toLocaleDateString('ar-EG');
const tm=d=>new Date(d).toLocaleString('ar-EG',{dateStyle:'short',timeStyle:'short'});
const METH=['كاش','تحويل بنكي','جوال باي','محفظة','أخرى'];
let tab='sell',cart=[],q='',pm='كاش',mode='now',sel='',role=null,me='',pcs='',pam='',dsc='',csq='',qst='',qsc='';
const TABS=[['sell','🛒','البيع'],['stock','📦','المخزون'],['cust','👥','الزبائن'],['sup','🚚','الموردين'],['exp','💸','المصروفات'],['rep','📊','التقارير']];
const debt=c=>c.log.reduce((s,l)=>s+(l.t==='debt'||l.t==='adj'?l.a:-l.a),0);
const moves=()=>{const a=db.sales.filter(s=>s.m!=='دين').map(s=>({d:s.d,m:s.m,a:s.total,t:'بيع فاتورة #'+s.no}));db.custs.forEach(c=>c.log.filter(l=>l.t==='pay').forEach(l=>a.push({d:l.d,m:l.m||'كاش',a:l.a,t:'سداد دين - '+c.name})));db.adj.forEach(j=>a.push({d:j.d,m:j.m,a:j.delta,t:'تعديل رصيد: '+j.note}));db.exps.filter(e=>e.m).forEach(e=>a.push({d:e.d,m:e.m,a:-e.a,t:'مصروف: '+e.cat+(e.note?' - '+e.note:'')}));db.buys.filter(b=>(b.paid==null?b.total:b.paid)>0).forEach(b=>a.push({d:b.d,m:b.m,a:-(b.paid==null?b.total:b.paid),t:'شراء من '+b.sup+': '+b.name}));db.spays.forEach(p=>a.push({d:p.d,m:p.m,a:-p.a,t:'دفعة للمورد '+((find('sups',p.sid)||{}).name||'')}));return a.sort((x,y)=>y.d-x.d)};
const cashBal=()=>moves().reduce((s,x)=>s+x.a,0);
const unit=i=>i.u==='g'?'غ':i.u==='ml'?'مل':'قطعة';
const stk=i=>i.u==='g'&&i.qty>=1000?(i.qty/1000).toFixed(2)+' كغ':i.qty+' '+unit(i);
let _cb=null;
function ov2(h){$('#md2').innerHTML=h;$('#ov2').style.display='flex'}
function cl2(){$('#ov2').style.display='none'}
function ask(m,fn){_cb=fn;ov2(`<h3>${esc(m)}</h3><div class="row"><button class="btn" style="flex:1" onclick="cl2();_cb&&_cb()">نعم</button><button class="btn g" style="flex:1" onclick="cl2()">إلغاء</button></div>`)}
let kp='',kpFn=null;
function inp(t,v,fn){kpFn=fn;kp='';ov2(`<h3>${esc(t)}</h3><div id="kd" class="kd" data-ph="الوزن بالغرام"></div><div class="kg">${['1','2','3','4','5','6','7','8','9','.','0','⌫'].map(k=>`<button onclick="kk('${k}')">${k}</button>`).join('')}</div><div class="row"><button class="btn" style="flex:1" onclick="kok()">إضافة</button><button class="btn g" onclick="cl2()">إلغاء</button></div>`)}
function kk(k){if(k==='⌫')kp=kp.slice(0,-1);else if(k==='.'){if(!kp.includes('.'))kp=(kp||'0')+'.'}else if(kp.length<8){kp+=k;if(kp.length>1&&kp[0]==='0'&&kp[1]!=='.')kp=kp.slice(1)}$('#kd').textContent=kp}
function kok(){const v=parseFloat(kp);if(!(v>0))return alert('أدخل الوزن');cl2();if(kpFn)kpFn(v)}
function toast(m,ms){const t=document.createElement('div');t.textContent=m;t.style.cssText='position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:12px;right:12px;background:var(--pr);color:var(--prt);padding:12px;border-radius:12px;z-index:60;text-align:center;font-weight:700';document.body.appendChild(t);setTimeout(()=>t.remove(),ms||2600)}
window.alert=m=>toast(m);
function cl(){cartOpen=false;$('#ov').style.display='none'}
function md(h){cartOpen=false;$('#md').innerHTML=h;$('#ov').style.display='flex'}
function R(){
 if(!role){$('#cartfab').style.display='none';$('#nv').innerHTML='';$('#bal').innerHTML='';$('#m').innerHTML=vLogin();return}
 $('#dt').textContent=new Date().toLocaleDateString('ar-EG',{weekday:'long',day:'numeric',month:'long'})+(offOK?' · 🟢 أوفلاين جاهز':' · ⚪ أوفلاين غير جاهز');
 $('#bal').innerHTML=role==='admin'?'<a onclick="balView()" style="cursor:pointer"><small>الرصيد ›</small><br>'+f(cashBal())+'</a> <button class="btn g s" onclick="menu()">⚙</button>':'<button class="btn g s" onclick="logout()">خروج</button>';
 $('#nv').innerHTML=TABS.filter(t=>role==='admin'||(t[0]!=='sup'&&t[0]!=='rep'&&t[0]!=='exp')).map(t=>`<button class="${tab===t[0]?'on':''}" onclick="tab='${t[0]}';R()"><b>${t[1]}</b>${t[2]}</button>`).join('');
 $('#m').innerHTML=({sell:vSell,stock:vStock,cust:vCust,sup:vSup,exp:vExp,rep:vRep})[tab]();
 $('#cartfab').style.display=tab==='sell'?'block':'none';const cb=$('#cbd');cb.textContent=cart.length;cb.style.display=cart.length?'block':'none';
 if(cartOpen)cartView();
}
/* ---------- الدخول والرصيد ---------- */
function vLogin(){return `<div class="card" style="margin-top:40px;text-align:center"><div style="font-size:48px">🚬</div><h3>Prof Cigarettes</h3><input id="lu" placeholder="اسم المستخدم" autocapitalize="none" autocomplete="username"><input id="lp" type="password" placeholder="كلمة المرور" autocomplete="current-password"><button class="btn" style="width:100%;margin-top:6px" onclick="login()">دخول</button><div class="mu" style="margin-top:10px">${offOK?'🟢 جاهز للعمل بدون إنترنت':'⚪ غير جاهز للأوفلاين بعد، أبقِ الصفحة مفتوحة ثم أعد فتحها'}</div></div>`}
function login(){const u=$('#lu').value.trim().toLowerCase(),p=$('#lp').value;const a=db.accts.find(x=>x.u.toLowerCase()===u&&x.p===p);if(a){role=a.r;me=a.u;tab='sell';R()}else alert('اسم المستخدم أو كلمة المرور غير صحيحة')}
function logout(){role=null;me='';cart=[];cl();cl2();R()}
function menu(){md(`<h3>الإعدادات</h3><div class="mu">سجائر اللف: وزن السيجارة (غ) ثم سعر السيجارة لكل نوع ورق (اتركه فارغاً ليُحسب من سعر الغرام)</div><input id="ro1" type="number" inputmode="decimal" value="${db.roll.g}"><input id="ro2" type="number" inputmode="decimal" placeholder="سعر سيجارة لزق" value="${db.roll.lz||''}"><input id="ro3" type="number" inputmode="decimal" placeholder="سعر سيجارة أوتومان" value="${db.roll.ot||''}"><button class="btn" style="width:100%" onclick="saveSet()">حفظ الإعدادات</button><h3>المستخدمون</h3>${db.accts.map((a,k)=>`<div class="card row sp"><div><b>${esc(a.u)}</b><div class="mu">${a.r==='admin'?'مدير':'بائع'}</div></div><div class="row"><button class="btn g s" onclick="acctForm(${k})">تعديل</button><button class="btn g s" onclick="delAcct(${k})">حذف</button></div></div>`).join('')}<button class="btn" style="width:100%" onclick="acctForm(-1)">＋ مستخدم جديد</button><button class="btn g" style="width:100%;margin-top:8px" onclick="cl();logout()">تسجيل الخروج</button>`)}
function saveSet(){db.roll={g:+$('#ro1').value>0?+$('#ro1').value:0.4,lz:+$('#ro2').value||0,ot:+$('#ro3').value||0};save();alert('تم الحفظ')}
function acctForm(k){const a=k>=0?db.accts[k]:{u:'',p:'',r:'user'};md(`<h3>${k>=0?'تعديل مستخدم':'مستخدم جديد'}</h3><input id="u1" placeholder="اسم المستخدم" autocapitalize="none" value="${esc(a.u)}"><input id="u2" placeholder="${k>=0?'كلمة مرور جديدة (اتركها فارغة لعدم التغيير)':'كلمة المرور'}"><select id="u3"><option value="user" ${a.r==='user'?'selected':''}>بائع (صلاحيات محدودة)</option><option value="admin" ${a.r==='admin'?'selected':''}>مدير (كل الصلاحيات)</option></select><div class="row" style="margin-top:8px"><button class="btn" style="flex:1" onclick="saveAcct(${k})">حفظ</button><button class="btn g" onclick="menu()">رجوع</button></div>`)}
function saveAcct(k){const u=$('#u1').value.trim(),p=$('#u2').value,r=$('#u3').value;if(!u)return alert('اكتب اسم المستخدم');if(db.accts.some((x,i)=>i!==k&&x.u.toLowerCase()===u.toLowerCase()))return alert('الاسم مستخدم مسبقاً');
 if(k<0){if(!p)return alert('اكتب كلمة المرور');db.accts.push({u,p,r})}
 else{const a=db.accts[k];if(a.r==='admin'&&r!=='admin'&&db.accts.filter(x=>x.r==='admin').length<2)return alert('يجب أن يبقى مدير واحد على الأقل');const own=a.u===me;a.u=u;if(p)a.p=p;a.r=r;if(own){me=u;role=r}}
 save();R();menu()}
function delAcct(k){const a=db.accts[k];if(a.u===me)return alert('لا يمكنك حذف حسابك الحالي');if(a.r==='admin'&&db.accts.filter(x=>x.r==='admin').length<2)return alert('يجب أن يبقى مدير واحد على الأقل');ask('حذف المستخدم '+a.u+'؟',()=>{db.accts.splice(k,1);save();menu()})}
function balView(fl){const t0=new Date().setHours(0,0,0,0),mv=moves(),ms=METH.map(m=>{const a=mv.filter(x=>x.m===m);return{m,all:a.reduce((s,x)=>s+x.a,0),td:a.filter(x=>x.d>=t0).reduce((s,x)=>s+x.a,0)}});
 const lst=mv.filter(x=>x.d>=t0&&(!fl||x.m===fl));
 md(`<h3>تفصيل الرصيد — ${f(cashBal())}</h3><div class="grid">${ms.map(x=>`<div class="card" style="${fl===x.m?'border-color:var(--pr)':''}" onclick="balView('${fl===x.m?'':x.m}')"><div class="mu">${x.m==='كاش'?'💵 ':'📱 '}${x.m}</div><b>${f(x.all)}</b><div class="mu">اليوم ${f(x.td)}</div><button class="btn g s" style="margin-top:6px" onclick="event.stopPropagation();adjForm('${x.m}')">تعديل</button></div>`).join('')}</div><button class="btn g" style="width:100%" onclick="adjRep()">📋 تقرير تعديلات الرصيد</button><h3>حركات اليوم ${fl?'— '+fl:''}</h3>${lst.map(x=>`<div class="card row sp"><div>${esc(x.t)}<div class="mu">${tm(x.d)} · ${x.m}</div></div><b class="${x.a<0?'bad':'ok'}">${x.a>0?'+':''}${f(x.a)}</b></div>`).join('')||'<p class="mu">لا توجد حركات اليوم</p>'}<button class="btn g" style="width:100%" onclick="cl()">إغلاق</button>`)}
function balEdit(id){const c=find('custs',id);md(`<h3>تعديل رصيد ${esc(c.name)}</h3><div class="mu">الرصيد الحالي (دين على الزبون) ${f(debt(c))}</div><input id="be1" type="number" inputmode="decimal" placeholder="الرصيد الجديد"><input id="be2" placeholder="سبب التعديل (اختياري)"><div class="mu">التعديل لا يغيّر رصيد الكاش، ويظهر في أرشيف الزبون.</div><div class="row" style="margin-top:8px"><button class="btn" style="flex:1" onclick="doBalEdit('${id}')">حفظ</button><button class="btn g" onclick="custView('${id}')">رجوع</button></div>`)}
function doBalEdit(id){const c=find('custs',id),nv=parseFloat($('#be1').value);if(isNaN(nv))return alert('أدخل الرصيد الجديد');const d=Math.round((nv-debt(c))*100)/100;if(d)c.log.unshift({id:uid(),d:Date.now(),t:'adj',a:d,note:'تعديل رصيد'+($('#be2').value.trim()?' - '+$('#be2').value.trim():'')});save();R();custView(id)}
function discView(all){const t0=new Date().setHours(0,0,0,0),ls=db.sales.filter(x=>x.disc>0&&(all||x.d>=t0)).slice(0,100),tot=ls.reduce((a,x)=>a+x.disc,0);
 md(`<h3>${all?'آخر الخصومات':'خصومات اليوم'} — <span class="bad">${f(tot)}</span></h3>${ls.map(x=>`<div class="card"><div class="row sp"><b>فاتورة #${x.no}${x.cn?' · '+esc(x.cn):''}</b><b class="bad">-${f(x.disc)}</b></div><div class="mu">${tm(x.d)} · قبل الخصم ${f(x.gross)} · بعده ${f(x.total)}${x.by?' · 👤 '+esc(x.by):''}</div></div>`).join('')||'<p class="mu">لا توجد خصومات</p>'}<div class="row"><button class="btn g s" onclick="discView(${all?0:1})">${all?'خصومات اليوم':'عرض آخر الخصومات'}</button><button class="btn g" style="flex:1" onclick="cl()">إغلاق</button></div>`)}
/* ---------- الطباعة والتقارير التفصيلية ---------- */
function doPrint(h){$('#prn').innerHTML=h;setTimeout(()=>{try{window.print()}catch(e){alert('الطباعة غير متاحة هنا')}},200)}
function custPrint(){md(`<h3>🖨️ تقرير الزبائن</h3><p class="mu">يفتح نافذة الطباعة. للحفظ كـ PDF اختر من معاينة الطباعة زر المشاركة ثم حفظ في الملفات (على الآيفون)، أو اختر "حفظ كـ PDF" كوجهة الطباعة (على الحاسوب والأندرويد).</p><button class="btn" style="width:100%;margin:4px 0" onclick="printCust(1)">المدينون فقط (مع تاريخ الحركات)</button><button class="btn g" style="width:100%;margin:4px 0" onclick="printCust(0)">كل الزبائن</button><button class="btn g" style="width:100%;margin-top:6px" onclick="cl()">إغلاق</button>`)}

  rows+=`<div class="card"><b>${esc(i.name)}</b><div class="mu">${i.q0?'بداية الجرد '+i.q0+' · ':''}مستلم ${rc} · مباع ${sd} · مستهلك/مجاني ${cs}</div><div class="row sp"><span class="mu">المتوقع ${ex} · الفعلي ${i.qty}</span><b class="${df<0?'bad':df>0?'ok':''}">${df>0?'+':''}${df} ${unit(i)}</b></div></div>`});
 const pd=sPaid(id),short=Math.max(0,sold-pd);
 md(`<h3>جرد ${esc(s.name)}</h3><div class="grid"><div class="card"><div class="mu">البضاعة المستلمة (جملة)</div><b>${f(sGoods(id))}</b></div><div class="card"><div class="mu">المباع (بسعر الجملة)</div><b>${f(sold)}</b></div><div class="card"><div class="mu">المخزون الحالي (جملة)</div><b>${f(st)}</b></div><div class="card"><div class="mu">المدفوع للمورد</div><b class="ok">${f(pd)}</b></div><div class="card"><div class="mu">المتبقي للمورد</div><b class="bad">${f(sDebt(s))}</b></div><div class="card"><div class="mu">فقد غير مفسّر (جملة)</div><b class="${loss>0?'bad':''}">${f(loss)}</b></div></div>${short>0?`<div class="card"><b class="bad">⚠ المباع من بضاعته أكثر من المدفوع له بمقدار ${f(short)}</b></div>`:''}<div class="mu">الفرق = الفعلي − المتوقع، والمتوقع = بداية الجرد + المستلم − المباع − المستهلك. السالب يعني نقصاً غير مبرَّر. ثبّت نقطة الجرد أولاً إن كان عندك مخزون سابق.</div>${rows||'<p class="mu">لا توجد أصناف مرتبطة بهذا المورد</p>'}<div class="row" style="margin-top:8px"><button class="btn g" style="flex:1" onclick="ask('تثبيت المخزون الحالي كنقطة بداية للجرد؟ تُحسب الحركات بعدها فقط.',()=>setBase('${id}'))">تثبيت نقطة الجرد</button><button class="btn g" onclick="supView('${id}')">رجوع</button></div>`)}
/* ---------- الزبائن ---------- */
function vCust(){const tot=db.custs.reduce((s,c)=>s+debt(c),0);
 return `<input id="qsc" placeholder="🔍 بحث عن زبون (اسم أو جوال)" value="${esc(qsc)}" oninput="qsc=this.value;sl('qsc')"><div class="card row sp"><span>إجمالي الديون</span><b class="bad">${f(tot)}</b></div><div class="row"><button class="btn" style="flex:1" onclick="custForm()">＋ زبون جديد</button><button class="btn g" style="flex:1" onclick="custPrint()">🖨️ تقرير PDF</button></div>
 ${db.custs.filter(c=>has(c.name+' '+c.phone,qsc)).map(c=>{const d=debt(c);return `<div class="card row sp" onclick="custView('${c.id}')"><div><b>${esc(c.name)}</b><div class="mu">${esc(c.phone)}</div></div><b class="${d>0?'bad':'ok'}">${f(d)}</b></div>`}).join('')}`}
function custForm(){md(`<h3>زبون جديد</h3><input id="c1" placeholder="الاسم"><input id="c2" placeholder="رقم الجوال" inputmode="tel">${role==='admin'?'<input id="c3" type="number" inputmode="decimal" placeholder="رصيد سابق على الزبون (اختياري)">':''}<div class="row"><button class="btn" style="flex:1" onclick="const n=$('#c1').value.trim();if(!n)return;db.custs.push({id:uid(),name:n,phone:$('#c2').value.trim(),log:(+($('#c3')&&$('#c3').value)>0?[{id:uid(),d:Date.now(),t:'adj',a:+$('#c3').value,note:'رصيد افتتاحي'}]:[])});save();cl();R()">حفظ</button><button class="btn g" onclick="cl()">إغلاق</button></div>`)}
function custView(id){const c=find('custs',id);let run=debt(c);
 const rows=c.log.map(l=>{const r=run;run-=(l.t==='debt'||l.t==='adj'?l.a:-l.a);return `<div class="card row sp"><div><b class="${l.t==='debt'||(l.t==='adj'&&l.a>0)?'bad':'ok'}">${l.t==='debt'?'دين':l.t==='adj'?'تعديل رصيد':'دفعة'} ${f(l.a)}</b><div class="mu">${tm(l.d)}${l.note?' · '+esc(l.note):''}</div></div><span class="mu">الرصيد ${f(r)}</span></div>`}).join('');
 md(`<div class="row sp"><h3 style="margin:0">${esc(c.name)}</h3><b class="${debt(c)>0?'bad':'ok'}">${f(debt(c))}</b></div><div class="mu">${esc(c.phone)}</div>
 <button class="btn g s" style="margin:6px 0" onclick="printCust(0,'${id}')">🖨️ كشف الزبون PDF</button><input id="ca" type="number" inputmode="decimal" placeholder="المبلغ"><select id="cm">${METH.map(m=>`<option>${m}</option>`).join('')}</select><input id="cn" placeholder="ملاحظة (اختياري)">
 <div class="row"><button class="btn ok" style="flex:1;background:var(--ok);color:#fff" onclick="cmov('${id}','pay')">تسجيل دفعة</button>${role==='admin'?`<button class="btn r" style="flex:1" onclick="cmov('${id}','debt')">إضافة دين</button><button class="btn g" onclick="balEdit('${id}')">تعديل الرصيد</button>`:''}</div>
 <h3>أرشيف المديونية</h3>${rows||'<p class="mu">لا توجد حركات</p>'}
 <div class="row">${role==='admin'?`<button class="btn g s" onclick="ask('حذف الزبون وأرشيفه؟',()=>{db.custs=db.custs.filter(x=>x.id!=='${id}');save();cl();R()})">حذف الزبون</button>`:''}<button class="btn g" style="flex:1" onclick="cl()">إغلاق</button></div>`)}
function cmov(id,t){const a=+$('#ca').value;if(!a||a<=0)return alert('أدخل مبلغاً صحيحاً');find('custs',id).log.unshift({id:uid(),d:Date.now(),t,a,m:t==='pay'?$('#cm').value:undefined,note:$('#cn').value.trim()});save();R();custView(id)}
/* ---------- التقارير ---------- */
function vRep(){const t0=new Date().setHours(0,0,0,0);const ts=db.sales.filter(s=>s.d>=t0);
 const sum=a=>a.reduce((s,x)=>s+x.total,0);
 const prof=a=>a.reduce((s,x)=>s+x.lines.reduce((p,l)=>p+(l.p-l.c)*l.q,0)-(x.disc||0),0);
 const low=db.items.filter(i=>i.qty<=(i.min||0)&&i.min>0);
 return `<div class="grid"><div class="card"><div class="mu">الرصيد الإجمالي</div><b>${f(cashBal())}</b></div><div class="card"><div class="mu">مبيعات اليوم</div><b>${f(sum(ts))}</b></div><div class="card"><div class="mu">ربح اليوم (قبل المصروفات)</div><b class="ok">${f(prof(ts))}</b></div><div class="card"><div class="mu">مصروفات اليوم</div><b class="bad">${f(db.exps.filter(e=>e.d>=t0).reduce((x,e)=>x+e.a,0))}</b></div><div class="card"><div class="mu">صافي ربح اليوم</div><b class="ok">${f(prof(ts)-db.exps.filter(e=>e.d>=t0).reduce((x,e)=>x+e.a,0))}</b></div><div class="card"><div class="mu">ديون الزبائن</div><b class="bad">${f(db.custs.reduce((s,c)=>s+debt(c),0))}</b></div><div class="card"><div class="mu">المخزون (بسعر الجملة)</div><b>${f(db.items.reduce((s,i)=>s+(i.cost||0)*i.qty,0))}</b></div><div class="card"><div class="mu">ديون الموردين</div><b class="bad">${f(db.sups.reduce((s,x)=>s+sDebt(x),0))}</b></div><div class="card" onclick="discView()"><div class="mu">خصومات اليوم ›</div><b class="bad">${f(db.sales.filter(x=>x.d>=t0).reduce((a,x)=>a+(x.disc||0),0))}</b></div></div>
 ${low.length?`<div class="card"><b class="bad">⚠ أصناف قاربت على النفاد</b>${low.map(i=>`<div class="mu">${esc(i.name)}: ${stk(i)}</div>`).join('')}</div>`:''}
 <button class="btn" style="width:100%;margin:8px 0" onclick="repView()">📅 تقرير تفصيلي بالتاريخ</button><h3>سجل المبيعات</h3>${db.sales.slice(0,60).map(s=>`<div class="card" onclick="saleView('${s.id}')"><div class="row sp"><b>فاتورة #${s.no}</b><b>${f(s.total)}</b></div><div class="mu">${tm(s.d)} · ${s.m}${s.cn?' · '+esc(s.cn):''}${s.by?' · 👤 '+esc(s.by):''}</div></div>`).join('')||'<p class="mu">لا توجد مبيعات</p>'}
 <h3>نسخ احتياطي</h3><div class="row"><button class="btn g" style="flex:1" onclick="bk()">تصدير / استيراد</button></div>`}
function saleView(id){const s=find('sales',id);md(`<h3>فاتورة #${s.no}</h3><div class="mu">${tm(s.d)} · ${s.m}${s.cn?' · '+esc(s.cn):''}${s.by?' · 👤 '+esc(s.by):''}</div>${s.lines.map(l=>`<div class="row sp card"><span>${esc(l.name)} × ${l.q}${l.u==='g'?' غ':l.u==='ml'?' مل':''}</span><b>${f(l.p*l.q)}</b></div>`).join('')}${s.disc?`<div class="row sp mu"><span>المجموع قبل الخصم</span><span>${f(s.gross)}</span></div><div class="row sp mu"><span>الخصم</span><span class="bad">-${f(s.disc)}</span></div>`:''}<div class="row sp"><b>الإجمالي</b><b>${f(s.total)}</b></div>${s.note?`<p class="mu">ملاحظة: ${esc(s.note)}</p>`:''}<button class="btn g" style="width:100%;margin-top:8px" onclick="cl()">إغلاق</button>`)}
function dump(img){const d=JSON.parse(JSON.stringify(db));if(!img)d.items.forEach(i=>{i.img=''});return JSON.stringify(d)}
async function expFile(img){const js=dump(img),name='prof-backup-'+new Date().toISOString().slice(0,10)+(img?'':'-noimg')+'.json';
 try{const file=new File([js],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return}}catch(e){if(e&&e.name==='AbortError')return}
 try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([js],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}catch(e){alert('تعذّر التصدير')}}
function impFile(el){const fl=el.files[0];if(!fl)return;const r=new FileReader();r.onload=()=>impData(r.result);r.readAsText(fl)}
function impData(t){try{const d=JSON.parse(t);if(!d.items||!d.sales)throw 0;ask('سيتم استبدال كل البيانات الحالية. متابعة؟',()=>{db=d;db.users=db.users||{admin:'admin123',user:'user123'};db.adj=db.adj||[];db.exps=db.exps||[];db.buys=db.buys||[];db.spays=db.spays||[];db.roll=db.roll||{g:0.4,lz:0,ot:0};db.accts=db.accts||[{u:'admin',p:(db.users&&db.users.admin)||'admin123',r:'admin'},{u:'user',p:(db.users&&db.users.user)||'user123',r:'user'}];save();cl();R()})}catch(e){alert('الملف أو النص غير صالح')}}
function imp(){impData($('#bt').value)}
function bk(){md(`<h3>نسخة احتياطية</h3><p class="mu">حجم البيانات الحالي ≈ ${Math.round(JSON.stringify(db).length/1024)} ك.ب. الصور هي الجزء الأكبر عادةً.</p><button class="btn" style="width:100%;margin:4px 0" onclick="expFile(true)">📤 تصدير كملف (مع الصور)</button><button class="btn g" style="width:100%;margin:4px 0" onclick="expFile(false)">📤 تصدير كملف بدون صور (أصغر)</button><div class="mu">تُفتح قائمة المشاركة: اختر حفظ في الملفات أو واتساب أو AirDrop.</div><h3>استيراد</h3><input type="file" onchange="impFile(this)"><div class="mu">اختر ملف النسخة الاحتياطية، وسيستبدل البيانات الحالية.</div><details style="margin-top:8px"><summary class="mu">استيراد من نص (للنسخ القديمة)</summary><textarea id="bt" rows="3" placeholder="الصق النص هنا"></textarea><button class="btn r" style="width:100%" onclick="imp()">استيراد من النص</button></details><button class="btn g" style="width:100%;margin-top:8px" onclick="cl()">إغلاق</button>`)}
let offOK=false;if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').then(()=>navigator.serviceWorker.ready).then(()=>{offOK=true;R()}).catch(()=>{})}
R();
</script>
